name: cloudflare-pages

# Manual trigger only, and deliberately so.
#
# This ran on every push to main until GitHub Actions stopped starting jobs on
# this account: "The job was not started because recent account payments have
# failed or your spending limit needs to be increased." The block is at account
# level, so the job never starts and no step ever runs -- nothing in this file
# can catch it or work around it. Left on a push trigger it simply painted a red
# cross on every merge while deploying nothing.
#
# Deploys are done by hand in the meantime:
#
#   npm run build
#   npx wrangler pages deploy          # reads ./wrangler.jsonc
#   npx wrangler deploy -c api/wrangler.jsonc
#
# Use the root config, not a bare "pages deploy dist". A direct-upload deploy
# replaces the bindings it does not declare, and the PRINTER_WORKER service
# binding lives in ./wrangler.jsonc precisely so it survives one. Without it
# the dashboard's /api/* returns 503.
#
# Once the billing problem is resolved, restore automatic deploys by putting
# the push trigger back:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name printer-dashboard --branch main
