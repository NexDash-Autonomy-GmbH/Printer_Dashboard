<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/printer.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050810" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Scan and email PDFs from the NexDash Xerox B305." />
    <title>Xerox B305</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = stored === "dark" || (stored !== "light" && prefersDark)
          document.documentElement.classList.add(dark ? "dark" : "light")
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
